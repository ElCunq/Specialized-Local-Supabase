version: "3.8"

services:
  # Control Plane (Next.js Orchestrator Dashboard)
  control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: db_orfa_control_plane
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - DATABASE_URL=file:/app/data/master_control_plane.db
      - DOCKER_SOCKET=/var/run/docker.sock
      - TRAEFIK_NETWORK=coolify
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - control_plane_data:/app/data
    networks:
      - coolify

volumes:
  control_plane_data:

networks:
  coolify:
    external: true
